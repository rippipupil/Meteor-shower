name: Probe APIs (temporal)
on:
  push:
    branches: [probe-apis]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          for c in "38.88&longitude=-6.97" "40.42&longitude=-3.70" "43.26&longitude=-2.93" "39.57&longitude=2.65" "28.47&longitude=-16.25" "41.39&longitude=2.17" "39.47&longitude=-0.38" "42.34&longitude=-7.86"; do
            echo "=== $c"
            curl -sS "https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=$c&localityLanguage=es" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(d.get('city'),'|',d.get('principalSubdivision'),'|',d.get('countryCode'))
          for a in d.get('localityInfo',{}).get('administrative',[]): print('  adm',a.get('adminLevel'),a.get('name'),'|',a.get('description'),'|',a.get('isoCode'))
          "
          done
          echo "=== geocoding admin2"; curl -sS "https://geocoding-api.open-meteo.com/v1/search?name=Merida&count=2&language=es" | head -c 900; echo
