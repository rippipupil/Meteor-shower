name: Probe APIs (temporal)
on:
  push:
    branches: [probe-apis]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          H='Origin: https://localhost'
          for u in "https://api.meteoalarm.org/edr/v1/collections?f=json" "https://api.meteoalarm.org/edr/v1/collections/warnings?f=json" "https://api.meteoalarm.org/edr/v1/collections/warnings/position?coords=POINT(-0.6%2038.6)&f=json" "https://api.meteoalarm.org/edr/v1/collections/warnings/position?coords=POINT(-3.7%2040.4)&f=json" "https://api.meteoalarm.org/edr/v1/collections/warnings/locations?f=json" "https://feeds.meteoalarm.org/api/v1/geocodes" ; do
            echo "=== $u"; curl -sS -m 30 -D hdr.txt -H "$H" "$u" -o body.txt || true
            grep -i "^HTTP\|access-control\|content-type\|content-length" hdr.txt; head -c 3000 body.txt; echo
          done
          echo "=== spain feed geocodes list"; curl -sS https://feeds.meteoalarm.org/api/v1/warnings/feeds-spain -o ma.json
          python3 - <<'PY'
          import json
          d=json.load(open('ma.json'))
          seen={}
          for x in d['warnings']:
              for i in x['alert']['info']:
                  if i.get('language')!='es-ES': continue
                  for a in i['area']:
                      for g in a.get('geocode',[]):
                          seen[g['value']]=a['areaDesc']
          for k in sorted(seen): print(k, seen[k])
          PY
